services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: 'file:/data/dev.db'
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 200
    volumes:
      - db-data:/data

volumes:
  db-data:
